<!DOCTYPE html>
<html lang="en" class="bg-zinc-950 text-zinc-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Photography Portfolio | Photo Collage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        zinc: {
                            950: '#09090b',
                            900: '#121215',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        /* Custom Masonry Column Break Rules */
        .masonry-item {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
        }

        /* Prevent image context highlighting & smooth rendering */
        img {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Hide scrollbars during full-screen modal open */
        body.modal-open {
            overflow: hidden;
        }

        /* Custom scrollbar styling for gallery page */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="min-h-screen bg-zinc-950 font-sans antialiased selection:bg-zinc-800 selection:text-white p-3 sm:p-4 md:p-6 lg:p-8">

    <!-- MAIN CONTAINER - Pure Photo Collage Grid -->
    <main class="max-w-[1920px] mx-auto">
        <!-- Masonry Grid Layout using CSS Columns (1 col mobile, 2 tablet, 3-4 desktop) -->
        <div id="gallery-grid" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-3 sm:gap-4 lg:gap-5 space-y-3 sm:space-y-4 lg:space-y-5">
            <!-- Photos dynamically rendered via JavaScript -->
        </div>
    </main>

    <!-- LIGHTBOX MODAL OVERLAY -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-zinc-950/95 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col justify-between p-4 sm:p-6" aria-hidden="true" role="dialog">
        
        <!-- Lightbox Top Navigation Bar -->
        <div class="flex justify-between items-center z-10 w-full text-zinc-400 text-xs tracking-widest uppercase">
            <!-- Photo Counter -->
            <div id="lightbox-counter" class="font-mono text-zinc-500">01 / 18</div>
            
            <!-- Quick Keyboard Instructions (Desktop) -->
            <div class="hidden sm:block text-zinc-500 text-[11px] font-mono">
                <span class="px-1.5 py-0.5 border border-zinc-800 rounded">←</span> 
                <span class="px-1.5 py-0.5 border border-zinc-800 rounded">→</span> NAVIGATE &nbsp;•&nbsp; 
                <span class="px-1.5 py-0.5 border border-zinc-800 rounded">ESC</span> CLOSE
            </div>

            <!-- Close Button -->
            <button id="lightbox-close" class="p-2 hover:text-white focus:outline-none transition-colors text-zinc-400 group" title="Close (Esc)">
                <svg class="w-6 h-6 transform group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Lightbox Main Stage (Image + Arrow Buttons) -->
        <div class="relative flex-1 flex items-center justify-center my-4 overflow-hidden select-none">
            
            <!-- Previous Button -->
            <button id="lightbox-prev" class="absolute left-2 sm:left-4 z-20 p-3 text-zinc-400 hover:text-white hover:bg-zinc-900/60 rounded-full transition-all focus:outline-none backdrop-blur-sm" title="Previous Image (Left Arrow)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <!-- Active Lightbox Photo Container -->
            <div class="relative max-w-full max-h-full flex items-center justify-center">
                <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[75vh] sm:max-h-[82vh] object-contain shadow-2xl opacity-0 transition-opacity duration-300 cursor-zoom-out" />
            </div>

            <!-- Next Button -->
            <button id="lightbox-next" class="absolute right-2 sm:right-4 z-20 p-3 text-zinc-400 hover:text-white hover:bg-zinc-900/60 rounded-full transition-all focus:outline-none backdrop-blur-sm" title="Next Image (Right Arrow)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Lightbox Bottom Caption Bar -->
        <div class="z-10 w-full max-w-4xl mx-auto text-center px-4">
            <h2 id="lightbox-title" class="text-sm sm:text-base font-medium tracking-wide text-zinc-200"></h2>
            <div class="flex justify-center items-center gap-3 text-xs text-zinc-500 font-mono mt-1">
                <span id="lightbox-location"></span>
                <span>•</span>
                <span id="lightbox-camera"></span>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /**
         * Editorial Photography Data Set

         * or your own hosted image URLs when deploying to GitHub Pages!
         */
        const photos = [
            {
                id: 1,
                title: "Tokyo Alley Rain",
                location: "Shinjuku, Tokyo",
                camera: "Leica M10 • 35mm f/1.4",
                src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 2,
                title: "Silent Horizon",
                location: "Reykjavík, Iceland",
                camera: "Sony A7 IV • 24-70mm f/2.8",
                src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "landscape"
            },
            {
                id: 3,
                title: "Shadows in Concrete",
                location: "Berlin, Germany",
                camera: "Fujifilm X100V • 23mm f/2.0",
                src: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "square"
            },
            {
                id: 4,
                title: "Transient Glance",
                location: "Paris, France",
                camera: "Canon R5 • 85mm f/1.2",
                src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 5,
                title: "Dune Geometry",
                location: "Death Valley, USA",
                camera: "Hasselblad X2D • 38mm f/2.5",
                src: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "landscape"
            },
            {
                id: 6,
                title: "Old Havana Soul",
                location: "Havana, Cuba",
                camera: "Nikon Z7 II • 50mm f/1.8",
                src: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 7,
                title: "Monolithic Spiral",
                location: "Valencia, Spain",
                camera: "Sony A7R V • 16-35mm f/2.8",
                src: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 8,
                title: "Golden Hour Waves",
                location: "Big Sur, California",
                camera: "Canon R6 • 70-200mm f/2.8",
                src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "landscape"
            },
            {
                id: 9,
                title: "Mist in the Pines",
                location: "Kyoto, Japan",
                camera: "Leica Q2 • 28mm f/1.7",
                src: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "square"
            },
            {
                id: 10,
                title: "Urban Reflection",
                location: "New York City, USA",
                camera: "Fujifilm GFX 100S • 45mm f/2.8",
                src: "https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 11,
                title: "Solitude in Alpine",
                location: "Dolomites, Italy",
                camera: "Nikon Z8 • 24-120mm f/4",
                src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "landscape"
            },
            {
                id: 12,
                title: "Midnight Light Trail",
                location: "Hong Kong",
                camera: "Sony A7 III • 35mm f/1.4",
                src: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 13,
                title: "Minimal Facade",
                location: "Copenhagen, Denmark",
                camera: "Leica SL2 • 50mm f/2.0",
                src: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 14,
                title: "Autumn Fog",
                location: "Black Forest, Germany",
                camera: "Canon R5 • 50mm f/1.2",
                src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "landscape"
            },
            {
                id: 15,
                title: "Echoes of Marble",
                location: "Rome, Italy",
                camera: "Nikon D850 • 24mm f/1.8",
                src: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "portrait"
            },
            {
                id: 16,
                title: "Coastal Cliff Silhouette",
                location: "Algarve, Portugal",
                camera: "Sony A7S III • 24mm f/1.4",
                src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop",
                aspectRatio: "landscape"
            }
        ];

        // State variables
        let currentIndex = 0;
        const totalPhotos = photos.length;

        // DOM Element references
        const gridContainer = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');
        const lightboxLocation = document.getElementById('lightbox-location');
        const lightboxCamera = document.getElementById('lightbox-camera');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const closeBtn = document.getElementById('lightbox-close');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');

        /**
         * Initialize Gallery Masonry Items
         */
        function initGallery() {
            gridContainer.innerHTML = '';
            
            photos.forEach((photo, index) => {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'masonry-item relative group overflow-hidden bg-zinc-900 cursor-pointer transition-transform duration-300';
                
                // Image element with lazy loading & smooth fade-in
                const img = document.createElement('img');
                img.src = photo.thumb;
                img.alt = photo.title;
                img.loading = "lazy";
                img.className = 'w-full h-auto object-cover transform transition-all duration-700 ease-out group-hover:scale-[1.03] group-hover:brightness-105';

                // Image load handler
                img.onerror = function() {
                    this.src = `https://placehold.co/800x1100/18181b/a1a1aa?text=${encodeURIComponent(photo.title)}`;
                };

                // Subtle Hover Overlay Caption
                const overlay = document.createElement('div');
                overlay.className = 'absolute inset-0 bg-gradient-to-t from-zinc-950/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 pointer-events-none';
                
                const titleText = document.createElement('span');
                titleText.className = 'text-xs font-medium tracking-wide text-zinc-100 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300';
                titleText.textContent = photo.title;

                const locText = document.createElement('span');
                locText.className = 'text-[11px] font-mono text-zinc-400 mt-0.5 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-300 delay-75';
                locText.textContent = photo.location;

                overlay.appendChild(titleText);
                overlay.appendChild(locText);

                itemWrapper.appendChild(img);
                itemWrapper.appendChild(overlay);

                // Open lightbox on photo click
                itemWrapper.addEventListener('click', () => openLightbox(index));

                gridContainer.appendChild(itemWrapper);
            });
        }

        /**
         * Lightbox Functions
         */
        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            lightbox.classList.add('opacity-100');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
        }

        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0', 'pointer-events-none');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
            
            setTimeout(() => {
                lightboxImg.src = '';
            }, 300);
        }

        function updateLightboxContent() {
            const photo = photos[currentIndex];
            
            // Fade image out during update
            lightboxImg.classList.add('opacity-0');

            setTimeout(() => {
                lightboxImg.src = photo.src;
                lightboxImg.alt = photo.title;
                lightboxTitle.textContent = photo.title;
                lightboxLocation.textContent = photo.location;
                lightboxCamera.textContent = photo.camera;
                lightboxCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(totalPhotos).padStart(2, '0')}`;

                lightboxImg.onload = () => {
                    lightboxImg.classList.remove('opacity-0');
                };
            }, 150);
        }

        function showNextPhoto() {
            currentIndex = (currentIndex + 1) % totalPhotos;
            updateLightboxContent();
        }

        function showPrevPhoto() {
            currentIndex = (currentIndex - 1 + totalPhotos) % totalPhotos;
            updateLightboxContent();
        }

        /**
         * Event Listeners
         */
        closeBtn.addEventListener('click', closeLightbox);
        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showNextPhoto();
        });
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showPrevPhoto();
        });

        // Click outside image or on full image container to close lightbox
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.id === 'lightbox-img' || e.target.parentElement?.id === 'lightbox-img') {
                closeLightbox();
            }
        });

        // Keyboard Navigation Support
        window.addEventListener('keydown', (e) => {
            if (lightbox.getAttribute('aria-hidden') === 'false') {
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowRight') {
                    showNextPhoto();
                } else if (e.key === 'ArrowLeft') {
                    showPrevPhoto();
                }
            }
        });

        // Mobile Touch Swipe Gestures for Lightbox
        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50; // Minimum drag distance
            if (touchEndX < touchStartX - threshold) {
                showNextPhoto(); // Swipe Left
            }
            if (touchEndX > touchStartX + threshold) {
                showPrevPhoto(); // Swipe Right
            }
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
