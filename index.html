<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photography Portfolio</title>
    <!-- Google Fonts for a clean minimalist look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #111111;
            line-height: 1.6;
            padding: 0 20px;
        }

        /* Header Navigation */
        header {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: #111;
        }

        nav a {
            text-decoration: none;
            color: #666;
            margin-left: 30px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #111;
        }

        /* Main Photo Grid (Collage Layout) */
        .gallery-container {
            max-width: 1200px;
            margin: 20px auto 80px auto;
            columns: 3;
            column-gap: 20px;
        }

        @media (max-width: 900px) {
            .gallery-container {
                columns: 2;
            }
        }

        @media (max-width: 600px) {
            .gallery-container {
                columns: 1;
            }
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            overflow: hidden;
            background-color: #f4f4f4;
            cursor: pointer;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        /* Lightbox Modal for Zooming */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .lightbox.active {
            display: flex;
        }
