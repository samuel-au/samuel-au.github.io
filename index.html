<!DOCTYPE html>
<html lang="en" class="bg-white text-zinc-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Au</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Consolas', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Custom Masonry Column Break Rules */
        .masonry-item {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
        }

        /* Prevent image context highlighting & smooth rendering */
        img {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Hide scrollbars during full-screen modal open */
        body.modal-open {
            overflow: hidden;
        }

        /* Custom scrollbar styling for gallery page */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4d4d8;
        }
    </style>
</head>
<body class="min-h-screen bg-white font-sans antialiased selection:bg-zinc-200 selection:text-zinc-900 p-4 sm:p-6 lg:p-8">

    <!-- TOP HEADER WITH RIGHT ALIGNED HEADLINE -->
    <header class="max-w-[1920px] mx-auto flex justify-end items-center mb-4 sm:mb-6 lg:mb-8">
        <h1 class="text-2xl sm:text-3xl font-medium tracking-normal text-zinc-900 font-mono">samuel au</h1>
    </header>

    <!-- MAIN CONTAINER - Pure Photo Collage Grid -->
    <main class="max-w-[1920px] mx-auto">
        <!-- Masonry Grid Layout using CSS Columns (1 col mobile, 2 tablet, 3-4 desktop) -->
        <div id="gallery-grid" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-3 sm:gap-4 lg:gap-5 space-y-3 sm:space-y-4 lg:space-y-5">
            <!-- Photos dynamically rendered via JavaScript -->
        </div>
    </main>

    <!-- LIGHTBOX MODAL OVERLAY -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-white/95 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-150 flex flex-col justify-between p-4 sm:p-6 select-none cursor-pointer" aria-hidden="true" role="dialog">
        
        <!-- Lightbox Top Navigation Bar -->
        <div class="flex justify-end items-center z-10 w-full pointer-events-auto">
            <!-- Close Button -->
            <button id="lightbox-close" class="p-2 hover:text-zinc-900 focus:outline-none transition-colors duration-150 text-zinc-500 group" title="Close (Esc)">
                <svg class="w-6 h-6 transform group-hover:scale-110 transition-transform duration-150" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Lightbox Main Stage (Image + Arrow Buttons) -->
        <div id="lightbox-stage" class="relative flex-1 flex items-center justify-center my-4 overflow-hidden">
            
            <!-- Previous Button -->
            <button id="lightbox-prev" class="absolute left-2 sm:left-4 z-20 p-3 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100/80 rounded-full transition-all duration-150 focus:outline-none backdrop-blur-sm pointer-events-auto" title="Previous Image (Left Arrow)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <!-- Active Lightbox Photo Container -->
            <div class="relative max-w-full max-h-full flex items-center justify-center pointer-events-auto">
                <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[82vh] object-contain shadow-xl opacity-0 transition-opacity duration-150 cursor-default" />
            </div>

            <!-- Next Button -->
            <button id="lightbox-next" class="absolute right-2 sm:right-4 z-20 p-3 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100/80 rounded-full transition-all duration-150 focus:outline-none backdrop-blur-sm pointer-events-auto" title="Next Image (Right Arrow)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Empty Spacer for Bottom Alignment Balance -->
        <div class="h-4"></div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /**
         * Editorial Photography Data Set
         * 
         * Automatic Sorting: Photos are automatically sorted in descending numerical order 
         * based on numbers in their filename or ID.
         * 
         * Example: Adding { id: 17, src: 'images/photo17.jpg' } anywhere in this array 
         * will automatically place it at the VERY TOP of your webpage!
         */
        const photos = [
            {
                id: 16,
                src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 15,
                src: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 14,
                src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 13,
                src: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 12,
                src: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 11,
                src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 10,
                src: "https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 9,
                src: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 8,
                src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 7,
                src: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 6,
                src: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 5,
                src: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 4,
                src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 3,
                src: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 2,
                src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=600&auto=format&fit=crop"
            },
            {
                id: 1,
                src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=1200&auto=format&fit=crop",
                thumb: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=600&auto=format&fit=crop"
            }
            {
                id: 17,
                src: "images/DSCF4376.jpg",
                thumb: "images/DSCF4376.jpg"
            }
        ];

        // Processed array containing photos sorted in descending order
        let displayPhotos = [];

        // Extract numerical index from filename or photo ID (e.g., 'images/photo17.jpg' -> 17)
        function getPhotoNumber(photo) {
            const src = photo.src || '';
            const match = src.match(/(\d+)(?=[^\d]*$)/) || src.match(/(\d+)/);
            if (match) return parseInt(match[1], 10);
            return typeof photo.id === 'number' ? photo.id : 0;
        }

        // Sort photos array descending by extracted photo number
        function sortPhotosDescending() {
            displayPhotos = [...photos].sort((a, b) => getPhotoNumber(b) - getPhotoNumber(a));
        }

        // State variables
        let currentIndex = 0;
        let totalPhotos = 0;

        // DOM Element references
        const gridContainer = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close');
        const prevBtn = document.getElementById('lightbox-prev');
        const nextBtn = document.getElementById('lightbox-next');

        /**
         * Initialize Gallery Masonry Items
         */
        function initGallery() {
            sortPhotosDescending();
            totalPhotos = displayPhotos.length;
            gridContainer.innerHTML = '';
            
            displayPhotos.forEach((photo, index) => {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'masonry-item relative group overflow-hidden bg-zinc-100 cursor-pointer transition-transform duration-150';
                
                // Image element with lazy loading & hover transition
                const img = document.createElement('img');
                img.src = photo.thumb;
                img.alt = `Photo ${getPhotoNumber(photo)}`;
                img.loading = "lazy";
                img.className = 'w-full h-auto object-cover transform transition-all duration-150 ease-out group-hover:scale-[1.02] group-hover:opacity-95';

                // Image load error fallback
                img.onerror = function() {
                    this.src = `https://placehold.co/800x1100/f4f4f5/52525b?text=Photo+${getPhotoNumber(photo)}`;
                };

                itemWrapper.appendChild(img);

                // Open lightbox on photo click
                itemWrapper.addEventListener('click', () => openLightbox(index));

                gridContainer.appendChild(itemWrapper);
            });
        }

        /**
         * Lightbox Functions
         */
        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
            
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            lightbox.classList.add('opacity-100');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
        }

        function closeLightbox() {
            lightbox.classList.remove('opacity-100');
            lightbox.classList.add('opacity-0', 'pointer-events-none');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
            
            setTimeout(() => {
                lightboxImg.src = '';
            }, 150);
        }

        function updateLightboxContent() {
            const photo = displayPhotos[currentIndex];
            
            // Fade image out during update
            lightboxImg.classList.add('opacity-0');

            setTimeout(() => {
                lightboxImg.src = photo.src;
                lightboxImg.alt = `Photo ${getPhotoNumber(photo)}`;

                lightboxImg.onload = () => {
                    lightboxImg.classList.remove('opacity-0');
                };
            }, 50);
        }

        function showNextPhoto() {
            currentIndex = (currentIndex + 1) % totalPhotos;
            updateLightboxContent();
        }

        function showPrevPhoto() {
            currentIndex = (currentIndex - 1 + totalPhotos) % totalPhotos;
            updateLightboxContent();
        }

        /**
         * Event Listeners
         */
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });
        
        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showNextPhoto();
        });
        
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showPrevPhoto();
        });

        // Click off the image (anywhere on background overlay) immediately closes the lightbox
        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg && !lightboxImg.contains(e.target)) {
                closeLightbox();
            }
        });

        // Prevent clicking directly on the image from closing
        lightboxImg.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        // Keyboard Navigation Support
        window.addEventListener('keydown', (e) => {
            if (lightbox.getAttribute('aria-hidden') === 'false') {
                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowRight') {
                    showNextPhoto();
                } else if (e.key === 'ArrowLeft') {
                    showPrevPhoto();
                }
            }
        });

        // Mobile Touch Swipe Gestures for Lightbox
        let touchStartX = 0;
        let touchEndX = 0;

        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50; // Minimum drag distance
            if (touchEndX < touchStartX - threshold) {
                showNextPhoto(); // Swipe Left
            }
            if (touchEndX > touchStartX + threshold) {
                showPrevPhoto(); // Swipe Right
            }
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
