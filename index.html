<!DOCTYPE html>
<html lang="en" class="bg-white text-zinc-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Photography Portfolio | Photo Collage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Consolas', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Custom Masonry Column Break Rules */
        .masonry-item {
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            page-break-inside: avoid;
        }


        /* Prevent image context highlighting & smooth rendering */
        img {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }


        /* Hide scrollbars during full-screen modal open */
        body.modal-open {
            overflow: hidden;
        }


        /* Custom scrollbar styling for gallery page */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4d4d8;
        }
    </style>
</head>
<body class="min-h-screen bg-white font-sans antialiased selection:bg-zinc-200 selection:text-zinc-900 p-4 sm:p-6 lg:p-8">


    <!-- TOP HEADER WITH RIGHT ALIGNED HEADLINE -->
    <header class="max-w-[1920px] mx-auto flex justify-end items-center mb-4 sm:mb-6 lg:mb-8">
        <!-- Double size Consolas font allowing lower & mixed-case -->
        <h1 class="text-2xl sm:text-3xl font-medium tracking-normal text-zinc-900 font-mono">Portfolio</h1>
    </header>


    <!-- MAIN CONTAINER - Pure Photo Collage Grid -->
    <main class="max-w-[1920px] mx-auto">
        <!-- Masonry Grid Layout using CSS Columns (1 col mobile, 2 tablet, 3-4 desktop) -->
        <div id="gallery-grid" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-3 sm:gap-4 lg:gap-5 space-y-3 sm:space-y-4 lg:space-y-5">
            <!-- Photos dynamically rendered via JavaScript -->
        </div>
    </main>


    <!-- LIGHTBOX MODAL OVERLAY -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-white/95 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-150 flex flex-col justify-between p-4 sm:p-6 select-none cursor-pointer" aria-hidden="true" role="dialog">
       
        <!-- Lightbox Top Navigation Bar -->
        <div class="flex justify-end items-center z-10 w-full pointer-events-auto">
            <!-- Close Button -->
            <button id="lightbox-close" class="p-2 hover:text-zinc-900 focus:outline-none transition-colors duration-150 text-zinc-500 group" title="Close (Esc)">
                <svg class="w-6 h-6 transform group-hover:scale-110 transition-transform duration-150" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>


        <!-- Lightbox Main Stage (Image + Arrow Buttons) -->
        <div id="lightbox-stage" class="relative flex-1 flex items-center justify-center my-4 overflow-hidden">
           
            <!-- Previous Button -->
            <button id="lightbox-prev" class="absolute left-2 sm:left-4 z-20 p-3 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100/80 rounded-full transition-all duration-150 focus:outline-none backdrop-blur-sm pointer-events-auto" title="Previous Image (Left Arrow)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>


            <!-- Active Lightbox Photo + Metadata Card -->
            <div id="lightbox-card" class="relative max-w-full max-h-full flex flex-col items-center justify-center pointer-events-auto select-text cursor-default">
                <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[76vh] object-contain shadow-xl opacity-0 transition-opacity duration-150 cursor-default" />
                <!-- Full EXIF Metadata display directly below photo (date · camera · settings) -->
                <div id="lightbox-meta" class="mt-3 font-mono text-xs sm:text-sm text-zinc-600 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 opacity-0 transition-opacity duration-150 cursor-default select-text">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>


            <!-- Next Button -->
            <button id="lightbox-next" class="absolute right-2 sm:right-4 z-20 p-3 text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100/80 rounded-full transition-all duration-150 focus:outline-none backdrop-blur-sm pointer-events-auto" title="Next Image (Right Arrow)">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>


        <!-- Empty Spacer for Bottom Alignment Balance -->
        <div class="h-4"></div>


    </div>


    <!-- JAVASCRIPT LOGIC -->
    <script>
        /**
         * Editorial Photography Data Set with Full Metadata
         *
         * To replace these with your own photos:
         * Change the 'src' value to your local image path (e.g. 'images/photo1.jpg').
         *
         * Metadata fields:
         * - date: Shown on hover in grid & in lightbox (used for automatic chronological sorting)
         * - camera: Shown in lightbox
         * - settings: Shown in lightbox (e.g. '24mm · f/8.0 · 15" · ISO 100')
         */
        const photos = [
            {
                id: 16,
                src: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80",
                alt: "Coastline Sunset",
                date: "2026.11.12",
                camera: "Fujifilm X100VI",
                settings: "23mm · f/2.0 · 1/500s · ISO 160"
            },
            {
                id: 15,
                src: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=1000&q=80",
                alt: "Ancient Architecture",
                date: "2026.10.28",
                camera: "Leica M11",
                settings: "35mm · f/1.4 · 1/1000s · ISO 100"
            },
            {
                id: 14,
                src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=80",
                alt: "Forest Canopy",
                date: "2026.09.15",
                camera: "Sony Alpha A7 IV",
                settings: '24mm · f/8.0 · 15" · ISO 100'
            },
            {
                id: 13,
                src: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=80",
                alt: "Urban Glass Facade",
                date: "2026.08.04",
                camera: "Canon EOS R5",
                settings: "24mm · f/4.0 · 1/800s · ISO 400"
            },
            {
                id: 12,
                src: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1000&q=80",
                alt: "Long Exposure Sea Rocks",
                date: "2026.07.21",
                camera: "Ricoh GR III",
                settings: '18.3mm · f/5.6 · 2.5" · ISO 200'
            },
            {
                id: 11,
                src: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80",
                alt: "Alpine Mountain Peaks",
                date: "2026.06.30",
                camera: "Nikon Z6 II",
                settings: "85mm · f/1.8 · 1/4000s · ISO 100"
            },
            {
                id: 10,
                src: "https://images.unsplash.com/photo-1477959858617-67f30ac4ce78?auto=format&fit=crop&w=1000&q=80",
                alt: "City Night Lights",
                date: "2026.05.18",
                camera: "Fujifilm X-T5",
                settings: "16mm · f/5.6 · 1/125s · ISO 160"
            },
            {
                id: 9,
                src: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=80",
                alt: "Misty Pine Forest",
                date: "2026.04.10",
                camera: "Hasselblad X2D 100C",
                settings: "38mm · f/2.5 · 1/60s · ISO 64"
            },
            {
                id: 8,
                src: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1000&q=80",
                alt: "Mountain Valley Mist",
                date: "2026.03.22",
                camera: "Fujifilm X100V",
                settings: "23mm · f/2.0 · 1/1000s · ISO 320"
            },
            {
                id: 7,
                src: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1000&q=80",
                alt: "Interior Shadow Study",
                date: "2026.02.14",
                camera: "Sony A7R V",
                settings: "35mm · f/2.8 · 1/160s · ISO 800"
            },
            {
                id: 6,
                src: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1000&q=80",
                alt: "Editorial Portrait",
                date: "2026.01.05",
                camera: "Leica Q3",
                settings: "28mm · f/1.7 · 1/2000s · ISO 100"
            },
            {
                id: 5,
                src: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1000&q=80",
                alt: "Autumn Woodland Path",
                date: "2025.12.19",
                camera: "Canon EOS R6 Mark II",
                settings: "70mm · f/2.8 · 1/400s · ISO 160"
            },
            {
                id: 4,
                src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80",
                alt: "Monochrome Portrait",
                date: "2025.11.08",
                camera: "Fujifilm Pro3",
                settings: "35mm · f/1.4 · 1/500s · ISO 200"
            },
            {
                id: 3,
                src: "https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=1000&q=80",
                alt: "Valley Sunrise",
                date: "2025.10.12",
                camera: "Sony FX3",
                settings: "24mm · f/2.0 · 1/250s · ISO 400"
            },
            {
                id: 2,
                src: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1000&q=80",
                alt: "Starry Mountain Night",
                date: "2025.09.01",
                camera: "Nikon Zf",
                settings: "40mm · f/2.0 · 1/1250s · ISO 100"
            },
            {
                id: 1,
                src: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1000&q=80",
                alt: "Tokyo Street Rain",
                date: "2025.08.20",
                camera: "Ricoh GR IIIx",
                settings: "26.1mm · f/2.8 · 1/160s · ISO 200"
            }
        ];


        // Safe SVG placeholder fallback Data URI if an image link fails or is offline
        const fallbackSVG = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='600' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%2523f4f4f5'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='16' fill='%2523a1a1aa'%3EImage Unavailable%3C/text%3E%3C/svg%3E";


        // Array storing sorted photos
        let displayPhotos = [];
        let currentIndex = 0;


        // Extract numerical index from filename or photo ID
        function getPhotoNumber(photo) {
            const src = photo.src || '';
            const match = src.match(/(\d+)(?=[^\d]*$)/) || src.match(/(\d+)/);
            if (match) return parseInt(match[1], 10);
            return typeof photo.id === 'number' ? photo.id : 0;
        }


        // Helper to parse date string into timestamp (supports YYYY.MM.DD, YYYY-MM-DD, YYYY/MM/DD)
        function parsePhotoDate(dateStr) {
            if (!dateStr) return 0;
            const normalized = dateStr.replace(/\./g, '-');
            const timestamp = Date.parse(normalized);
            return isNaN(timestamp) ? 0 : timestamp;
        }


        // Sort photos descending by date (most recent date first)
        function sortPhotosDescending() {
            displayPhotos = [...photos].sort((a, b) => {
                const dateA = parsePhotoDate(a.date);
                const dateB = parsePhotoDate(b.date);
                if (dateB !== dateA) {
                    return dateB - dateA; // Newest date sits at top
                }
                return getPhotoNumber(b) - getPhotoNumber(a); // Fallback tie-breaker
            });
        }


        // DOM Elements
        const galleryGrid = document.getElementById('gallery-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxMeta = document.getElementById('lightbox-meta');
        const lightboxClose = document.getElementById('lightbox-close');
        const lightboxPrev = document.getElementById('lightbox-prev');
        const lightboxNext = document.getElementById('lightbox-next');
        const lightboxCard = document.getElementById('lightbox-card');


        // Render Masonry Grid
        function renderGallery() {
            sortPhotosDescending();
            galleryGrid.innerHTML = '';
           
            displayPhotos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'masonry-item relative group overflow-hidden bg-zinc-100 rounded-sm cursor-pointer break-inside-avoid';
               
                // HTML for Grid item: Image + Hover Scrim with DATE ONLY
                item.innerHTML = `
                    <img
                        src="${photo.src}"
                        alt="${photo.alt || 'Portfolio Photograph'}"
                        loading="lazy"
                        onerror="this.onerror=null; this.src='${fallbackSVG}';"
                        class="w-full h-auto object-cover transition-all duration-150 group-hover:scale-[1.015] group-hover:opacity-95"
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-150 flex items-end p-3 pointer-events-none">
                        <span class="font-mono text-xs text-white/90 tracking-wide">${photo.date || ''}</span>
                    </div>
                `;


                item.addEventListener('click', () => openLightbox(index));
                galleryGrid.appendChild(item);
            });
        }


        // Lightbox Operations
        function openLightbox(index) {
            currentIndex = index;
            updateLightboxContent();
           
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
            lightbox.classList.add('opacity-100', 'pointer-events-auto');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
        }


        function closeLightbox() {
            lightbox.classList.remove('opacity-100', 'pointer-events-auto');
            lightbox.classList.add('opacity-0', 'pointer-events-none');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
        }


        function updateLightboxContent() {
            const photo = displayPhotos[currentIndex];
            if (!photo) return;


            // Fade out current content briefly for quick transition
            lightboxImg.style.opacity = '0';
            lightboxMeta.style.opacity = '0';


            setTimeout(() => {
                lightboxImg.src = photo.src;
                lightboxImg.alt = photo.alt || 'Portfolio Photograph';
               
                // Error handler for lightbox image
                lightboxImg.onerror = function() {
                    this.onerror = null;
                    this.src = fallbackSVG;
                };


                // Render all 3 metadata items cleanly: DATE · CAMERA · SETTINGS
                const metaParts = [];
                if (photo.date) metaParts.push(`<span>${photo.date}</span>`);
                if (photo.camera) metaParts.push(`<span>${photo.camera}</span>`);
                if (photo.settings) metaParts.push(`<span>${photo.settings}</span>`);
               
                lightboxMeta.innerHTML = metaParts.join('<span class="text-zinc-300">·</span>');


                lightboxImg.style.opacity = '1';
                lightboxMeta.style.opacity = '1';
            }, 50);
        }


        function nextPhoto(e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex + 1) % displayPhotos.length;
            updateLightboxContent();
        }


        function prevPhoto(e) {
            if (e) e.stopPropagation();
            currentIndex = (currentIndex - 1 + displayPhotos.length) % displayPhotos.length;
            updateLightboxContent();
        }


        // Click-off backdrop exit (exits if click target is outside the combined photo+meta card and buttons)
        lightbox.addEventListener('click', (e) => {
            const isClickInsideCard = lightboxCard.contains(e.target);
            const isClickInsidePrev = lightboxPrev.contains(e.target);
            const isClickInsideNext = lightboxNext.contains(e.target);
           
            if (!isClickInsideCard && !isClickInsidePrev && !isClickInsideNext) {
                closeLightbox();
            }
        });


        // Event Listeners
        lightboxClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });
        lightboxNext.addEventListener('click', nextPhoto);
        lightboxPrev.addEventListener('click', prevPhoto);


        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('opacity-100')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextPhoto();
                if (e.key === 'ArrowLeft') prevPhoto();
            }
        });


        // Touch Swipe Gestures for Mobile
        let touchStartX = 0;
        let touchEndX = 0;


        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });


        lightbox.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });


        function handleSwipe() {
            const swipeThreshold = 50;
            if (touchEndX < touchStartX - swipeThreshold) {
                nextPhoto();
            } else if (touchEndX > touchStartX + swipeThreshold) {
                prevPhoto();
            }
        }


        // Initialize Gallery on Load
        window.addEventListener('DOMContentLoaded', renderGallery);
    </script>
</body>
</html>
